```html
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Create Account</title>
        <link rel="stylesheet" href="../css/register.css">
    </head>

    <body>
        <div class="register-container">
            <div class="register-box">

                <img src="../Assets/images/logo.png" alt="CloudDesk Logo" class="logo">

                <h1>Create Account</h1>

                <form action="/register" method="post">

                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            required
                            autofocus
                        >
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="role">Role</label>

                        <select id="role" name="role" required>
                            <option value="employee">Employee</option>
                            <option value="technician">Technician</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <button type="submit" class="create-btn">
                        Create Account
                    </button>

                </form>

                <a href="dashboard.html">Back to Dashboard</a>

            </div>
        </div>

        <script>
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;

            const eyeClosed = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.32 21.32 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

            toggleBtn.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.innerHTML = eyeClosed;
                }
                else {
                    passwordInput.type = 'password';
                    eyeIcon.innerHTML = eyeOpen;
                }
            });
        </script>
    </body>
</html>
```
